<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Sige77</title>
    <link rel="icon" href="../assets/img/ic_launcher.png" />
    <link rel="apple-touch-icon" href="../assets/img/ic_launcher.png" />
    <link rel="stylesheet" href="css/app.css" />
    <!--
      This page is the content the reconstructed shell frames (X5_Activity.E appends
      "/m/index.html" because the manifest sets isSingleLine = 0), so it stands exactly where the
      merchant product sat in the original APK.

      "root" — merchant markup marker checked by the shell's anti-hijack probe
      (jg.shouldInterceptRequest in the APK, webview.js checkHijack here). Keep the word present.

      The screens below are the owner-specified product layer (directive §17): login, registration,
      OTP, home, catalog, game play, notifications and profile. They are reconstructed equivalents
      built to the owner's contract, not recovered merchant markup.
    -->
    <div id="app" hidden>
      <main id="view" class="view" role="main"></main>

      <nav id="tabbar" class="tabbar" hidden aria-label="Primary">
        <a class="tab" data-tab="home" href="#/home">
          <span class="tab-icon" aria-hidden="true">⌂</span>
          <span class="tab-label">Home</span>
        </a>
        <a class="tab" data-tab="games" href="#/games">
          <span class="tab-icon" aria-hidden="true">◉</span>
          <span class="tab-label">Games</span>
        </a>
        <a class="tab" data-tab="notifications" href="#/notifications">
          <span class="tab-icon" aria-hidden="true">♢</span>
          <span class="tab-label">Alerts</span>
          <span class="tab-badge" data-badge="notifications" hidden></span>
        </a>
        <a class="tab" data-tab="profile" href="#/profile">
          <span class="tab-icon" aria-hidden="true">☺</span>
          <span class="tab-label">Profile</span>
        </a>
      </nav>

      <div id="toastHost" class="toast-host" aria-live="polite"></div>
      <div id="sheetHost" class="sheet-host"></div>
      <div id="dialogHost" class="dialog-host"></div>
    </div>

    <div id="boot" class="boot">
      <div class="boot-logo">
        <img src="../assets/img/splash_logo.jpg" alt="Sige77" />
      </div>
      <div class="boot-ring" role="status" aria-live="polite"><span></span></div>
      <p class="boot-text" id="bootText">Starting…</p>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
